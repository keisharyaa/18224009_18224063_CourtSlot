services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COURTSLOT_DB_PATH: /data/courtslot.sqlite3
      COURTSLOT_AERIVA_API_KEY: ${COURTSLOT_AERIVA_API_KEY:-}
      COURTSLOT_LOCALLOOP_API_KEY: ${COURTSLOT_LOCALLOOP_API_KEY:-}
    volumes:
      - courtslot_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  courtslot_data:
